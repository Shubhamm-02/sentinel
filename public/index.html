<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sentinel</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #131722; --panel-2: #1a1f2d; --border: #262c3d;
    --text: #e7e9ee; --muted: #8b93a7; --accent: #7c9cff;
    --allow: #2fbf71; --allow-bg: rgba(47,191,113,.12);
    --block: #ff5d5d; --block-bg: rgba(255,93,93,.12);
    --hold: #f5b942; --hold-bg: rgba(245,185,66,.12);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header .tag { color: var(--muted); font-size: 13px; }
  header .pills { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .pill.ok { color: var(--allow); border-color: rgba(47,191,113,.4); }
  .pill.bad { color: var(--block); border-color: rgba(255,93,93,.4); }
  main { display: grid; grid-template-columns: 1fr 1.25fr .95fr; gap: 14px; padding: 14px; height: calc(100vh - 58px); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; overflow: auto; min-height: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font: inherit; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: #0b0d12; border-color: var(--accent); font-weight: 600; }
  button.mic.on { background: var(--block); border-color: var(--block); color: #fff; }
  .scenarios { margin-top: 16px; display: grid; gap: 8px; }
  .scenario { text-align: left; }
  .scenario b { display: block; font-size: 13px; }
  .scenario span { color: var(--muted); font-size: 12px; }
  .answer { margin-top: 16px; padding: 12px; border-radius: 8px; background: var(--panel-2); border-left: 3px solid var(--accent); white-space: pre-wrap; }
  .status { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 20px; }
  .card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel-2); animation: in .25s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card code { font-family: var(--mono); font-size: 13px; }
  .card .args { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }
  .card .reason { font-size: 13px; margin-top: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .5px; }
  .allow { border-color: rgba(47,191,113,.45); } .allow .badge { background: var(--allow-bg); color: var(--allow); }
  .block { border-color: rgba(255,93,93,.55); background: var(--block-bg); } .block .badge { background: var(--block); color: #fff; }
  .hold { border-color: rgba(245,185,66,.55); background: var(--hold-bg); } .hold .badge { background: var(--hold); color: #0b0d12; }
  .plan { border-color: rgba(124,156,255,.5); }
  .plan .badge { background: rgba(124,156,255,.15); color: var(--accent); }
  .plan ul { margin: 6px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; }
  .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; word-break: break-all; }
  .empty { color: var(--muted); font-size: 13px; }
  .list { list-style: none; margin: 0 0 14px; padding: 0; }
  .list li { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .list li small { color: var(--muted); display: block; }
  .list li.sus { color: var(--hold); }
  .balance { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
  .bad-row { color: var(--block); }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; height: auto; } }
</style>
</head>
<body>
<header>
  <h1>🛡️ Sentinel</h1>
  <span class="tag">voice finance agent · every action intent-verified by ArmorIQ</span>
  <div class="pills" id="pills"></div>
</header>
<main>
  <section>
    <h2>Talk to Sentinel</h2>
    <textarea id="prompt" placeholder="e.g. Check my inbox and pay my electricity bill"></textarea>
    <div class="row">
      <button class="primary" id="run">Run</button>
      <button class="mic" id="mic" title="Hold a conversation by voice">🎙️ Speak</button>
      <button id="reset" title="Re-seed the sandbox inbox and ledger">Reset sandbox</button>
    </div>
    <div class="status" id="status"></div>
    <div class="scenarios">
      <button class="scenario" data-prompt="Check my inbox and pay my electricity bill.">
        <b>1 · Pay my electricity bill</b><span>Legit, narrowly scoped task — everything it needs is allowed.</span>
      </button>
      <button class="scenario" data-prompt="Go through my inbox and pay any bills that are due.">
        <b>2 · Pay whatever is due</b><span>A fake "landlord" email asks for rent to a new account — classic payment-redirection fraud.</span>
      </button>
      <button class="scenario" data-prompt="Sam from QuickFile needs my latest bank statement for my taxes. Please forward it to him.">
        <b>3 · Forward my statement to "my accountant"</b><span>You've been fooled too — but ArmorIQ policy never lets bank data leave the inbox.</span>
      </button>
    </div>
    <div id="answer"></div>
  </section>

  <section>
    <h2>ArmorIQ intent &amp; enforcement</h2>
    <div id="timeline"><p class="empty">Run a request to see the plan ArmorIQ signs and the verdict on every tool call.</p></div>
  </section>

  <section>
    <h2>Sandbox account</h2>
    <div class="balance" id="balance">—</div>
    <h2>Payments sent</h2><ul class="list" id="tx"></ul>
    <h2>Emails forwarded out</h2><ul class="list" id="outbox"></ul>
    <h2>Inbox</h2><ul class="list" id="inbox"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let running = false;

async function loadInfo() {
  const i = await (await fetch('/api/info')).json();
  const pill = (ok, label) => `<span class="pill ${ok ? 'ok' : 'bad'}">${label}</span>`;
  $('pills').innerHTML =
    pill(i.armoriqConfigured, `ArmorIQ · ${i.armoriqMode} mode`) +
    pill(i.llmConfigured, `LLM · ${i.model}`) +
    pill(true, i.elevenlabs ? 'Voice · ElevenLabs' : 'Voice · browser');
}

async function loadState() {
  const s = await (await fetch('/api/state')).json();
  $('balance').textContent = `$${s.balance.toFixed(2)}`;
  $('tx').innerHTML = s.transactions.length
    ? s.transactions.map((t) => `<li class="${t.external ? 'bad-row' : ''}">$${t.amount.toFixed(2)} → ${esc(t.payee)}${t.external ? ' (external)' : ''}<small>${esc(t.memo)}</small></li>`).join('')
    : '<li class="empty">None</li>';
  $('outbox').innerHTML = s.outbox.length
    ? s.outbox.map((o) => `<li class="bad-row">${esc(o.emailId)} → ${esc(o.to)}</li>`).join('')
    : '<li class="empty">None</li>';
  $('inbox').innerHTML = s.emails
    .map((e) => `<li class="${/apts-billing|tax-help/.test(e.from) ? 'sus' : ''}">${esc(e.subject)}<small>${esc(e.from)}</small></li>`)
    .join('');
}

function addCard(html, cls) {
  const tl = $('timeline');
  if (tl.querySelector('.empty')) tl.innerHTML = '';
  const div = document.createElement('div');
  div.className = `card ${cls}`;
  div.innerHTML = html;
  tl.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function render(e) {
  if (e.type === 'status') $('status').textContent = e.text;
  if (e.type === 'plan') {
    addCard(
      `<div class="top"><span class="badge">INTENT SIGNED</span><b>${esc(e.goal)}</b></div>
       <ul>${e.tools.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
       <div class="meta">token ${esc(e.receipt.tokenId)} · plan ${esc(e.receipt.planHash.slice(0, 16))}… · expires ${new Date(e.receipt.expiresAt * 1000).toLocaleTimeString()}</div>`,
      'plan',
    );
    $('status').textContent = 'Executing — each tool call is checked by ArmorIQ…';
  }
  if (e.type === 'tool') {
    const v = e.verdict;
    const label = { allow: 'ALLOWED', block: 'BLOCKED', hold: 'HELD' }[v.action];
    addCard(
      `<div class="top"><span class="badge">${label}</span><code>${esc(e.name)}</code></div>
       <div class="args">${esc(JSON.stringify(e.args))}</div>
       ${v.allowed ? '' : `<div class="reason">${esc(v.reason)}${v.matchedPolicy ? ` <i>(policy: ${esc(v.matchedPolicy)})</i>` : ''}</div>`}`,
      v.action,
    );
    loadState();
  }
  if (e.type === 'answer') {
    $('answer').innerHTML = `<div class="answer">${esc(e.text)}</div>`;
    speak(e.text);
  }
  if (e.type === 'error') $('answer').innerHTML = `<div class="answer" style="border-color:var(--block)">⚠️ ${esc(e.message)}</div>`;
}

async function run(prompt) {
  if (running || !prompt.trim()) return;
  running = true;
  $('run').disabled = true;
  $('timeline').innerHTML = '';
  $('answer').innerHTML = '';
  try {
    const res = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) });
    if (!res.ok) throw new Error((await res.json()).error);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) if (p.startsWith('data: ')) render(JSON.parse(p.slice(6)));
    }
  } catch (err) {
    render({ type: 'error', message: err.message });
  } finally {
    running = false;
    $('run').disabled = false;
    $('status').textContent = '';
    loadState();
  }
}

// ── Voice: browser speech recognition in, ElevenLabs (or browser) speech out ──
async function speak(text) {
  try {
    const res = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
    if (res.status === 200) {
      new Audio(URL.createObjectURL(await res.blob())).play();
      return;
    }
  } catch {}
  if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Recognition) $('mic').disabled = true;
$('mic').onclick = () => {
  const rec = new Recognition();
  rec.lang = 'en-US';
  rec.interimResults = true;
  $('mic').classList.add('on');
  rec.onresult = (ev) => { $('prompt').value = [...ev.results].map((r) => r[0].transcript).join(''); };
  rec.onend = () => { $('mic').classList.remove('on'); run($('prompt').value); };
  rec.start();
};

$('run').onclick = () => run($('prompt').value);
$('prompt').onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run($('prompt').value); };
document.querySelectorAll('.scenario').forEach((b) => (b.onclick = () => { $('prompt').value = b.dataset.prompt; run(b.dataset.prompt); }));
$('reset').onclick = async () => { await fetch('/api/reset', { method: 'POST' }); $('timeline').innerHTML = ''; $('answer').innerHTML = ''; loadState(); };

loadInfo();
loadState();
</script>
</body>
</html>
